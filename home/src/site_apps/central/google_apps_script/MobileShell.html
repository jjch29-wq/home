<style>
  :root {
    --central-blue: #174a8b;
  }

  body {
    background: #eef3f8;
    padding-bottom: 90px !important;
  }

  main {
    max-width: 1000px !important;
  }

  .workspace-panel {
    display: none;
    gap: 16px;
  }

  .workspace-panel.active {
    display: grid;
  }

  #workspace-local-status {
    grid-column: 1/-1;
  }

  .workspace-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 40;
    background: #fff;
    border-top: 1px solid #cbd5e1;
    display: flex;
    padding: 10px 8px max(10px, env(safe-area-inset-bottom));
    justify-content: center;
    gap: 6px;
  }

  .workspace-nav button {
    flex: 1;
    max-width: 180px;
    min-height: 44px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    color: #475569;
  }

  .workspace-nav button[aria-selected=true] {
    background: var(--central-blue);
    color: white;
  }

  .workspace-card {
    background: white;
    border: 1px solid #dbe3ee;
    padding: 18px;
    border-radius: 16px;
    box-shadow: 0 2px 8px #122d4b08;
  }

  .workspace-card h2 {
    font-size: 18px;
    font-weight: 800;
    color: #17375b;
    margin-bottom: 12px;
  }

  .workspace-card>summary {
    cursor: pointer;
    font-size: 14px;
    font-weight: 800;
    color: #17375b;
  }

  .workspace-check {
    display: flex !important;
    grid-template-columns: auto 1fr !important;
    align-items: center;
    gap: 8px;
    margin: 12px 0;
    font-size: 13px !important;
  }

  .workspace-check input {
    min-height: auto !important;
    width: 18px;
    height: 18px;
  }

  .workspace-card p {
    font-size: 13px;
    color: #475569;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .workspace-card button {
    min-height: 44px;
    padding: 8px 14px;
    background: #eaf0f9;
    color: #174a8b;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    margin: 6px 6px 0 0;
  }

  .workspace-card button.primary {
    background: #174a8b;
    color: white;
  }

  .workspace-card button:disabled {
    opacity: .5;
  }

  .workspace-filters {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .workspace-filters label {
    display: grid;
    gap: 5px;
    font-size: 12px;
    color: #475569;
  }

  .workspace-filters input,
  .workspace-filters select {
    min-width: 0;
    min-height: 44px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    padding: 8px;
    background: #f8fafc;
  }

  .workspace-status {
    font-size: 12px;
    background: #e8f0fa;
    color: #174a8b;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 12px;
  }

  .workspace-empty {
    padding: 25px;
    text-align: center;
    color: #64748b;
    font-size: 14px;
  }

  .progress-kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }

  .progress-kpi-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 12px;
  }

  .progress-kpi-card h3 {
    font-size: 12px;
    font-weight: 800;
    color: #475569;
    margin-bottom: 4px;
  }

  .progress-kpi-card .kpi-num {
    font-size: 20px;
    font-weight: 900;
    line-height: 1.2;
  }

  .progress-kpi-card .kpi-sub {
    font-size: 11px;
    color: #64748b;
    margin-top: 2px;
  }

  .progress-bar-bg {
    width: 100%;
    height: 6px;
    background: #e2e8f0;
    border-radius: 3px;
    margin-top: 6px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  .progress-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin-top: 12px;
    border-radius: 12px;
    border: 1px solid #cbd5e1;
    background: #fff;
  }

  .progress-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    text-align: right;
    white-space: nowrap;
  }

  .progress-table th,
  .progress-table td {
    padding: 8px 6px;
    border-bottom: 1px solid #e2e8f0;
    border-right: 1px solid #f1f5f9;
  }

  .progress-table th {
    background: #f1f5f9;
    color: #334155;
    font-weight: 800;
    text-align: center;
    position: sticky;
    top: 0;
  }

  .progress-table td:nth-child(1),
  .progress-table td:nth-child(2) {
    text-align: left;
    font-weight: 700;
  }

  .progress-table tr.subtotal {
    background: #e8f0fe;
    font-weight: 800;
  }

  @media(min-width:760px) {
    #workspace-input {
      grid-template-columns: 1fr 1fr;
      align-items: start;
    }

    #workspace-input>#edit-banner,
    #workspace-input>div:last-child {
      grid-column: 1/-1;
    }

    .workspace-filters {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .progress-kpi-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }

  .progress-billing-card {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 14px;
    padding: 14px;
    margin: 14px 0;
  }

  .progress-billing-total {
    font-size: 22px;
    font-weight: 900;
    color: #1e40af;
    line-height: 1.2;
  }

  .billing-sub-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 10px 0;
  }

  .billing-sub-item {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 8px 10px;
  }

  .billing-sub-item .title {
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
  }

  .billing-sub-item .amount {
    font-size: 13px;
    font-weight: 900;
    color: #1e293b;
    margin-top: 2px;
  }

  .billing-toggle-btn {
    width: 100%;
    padding: 10px 12px;
    background: #e2e8f0;
    color: #1e293b;
    border-radius: 10px;
    font-weight: 800;
    font-size: 12px;
    text-align: center;
    cursor: pointer;
    border: none;
    margin-top: 8px;
  }

  .billing-toggle-btn:active {
    background: #cbd5e1;
  }

  @media(min-width:760px) {
    #workspace-input {
      grid-template-columns: 1fr 1fr;
      align-items: start;
    }

    #workspace-input>#edit-banner,
    #workspace-input>div:last-child {
      grid-column: 1/-1;
    }

    .workspace-filters {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .progress-kpi-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .billing-sub-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }
</style>
<script>

  function workspaceSwitch(page) {

    if (page === 'pending') workspaceRenderPending();

  }
  async function workspaceCall(name, payload) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) throw new Error('24시간 웹앱 주소에서 접속하세요.');
    const result = await new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](payload));
    return typeof result === 'string' ? JSON.parse(result) : result;
  }
  function workspaceValidate(payload) {
