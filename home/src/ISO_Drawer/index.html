<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>ISO Drawer</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#e8f1f5;font:14px Arial,sans-serif;overflow:hidden}header{height:54px;display:flex;align-items:center;gap:7px;padding:8px;background:#1c2a34;border-bottom:1px solid #37505f}button,input,select{background:#263945;color:#eef;border:1px solid #4d6b79;border-radius:4px;padding:8px}button:hover{background:#385566}main{display:grid;grid-template-columns:1fr 245px;height:calc(100vh - 80px)}canvas{width:100%;height:100%;background:#17232d;cursor:crosshair}aside{padding:12px;background:#1b2933;border-left:1px solid #37505f}label{display:block;margin-top:12px;margin-bottom:4px;color:#9fc0cc}aside input,aside select,aside button{width:100%}.help{line-height:1.65;color:#a9bec7;margin-top:22px}footer{height:26px;padding:5px 10px;background:#20313b}.brand{font-size:19px;font-weight:bold;color:#64e6db;margin-right:15px}.sep{flex:1}@page{size:A3 landscape;margin:10mm}@media print{header,aside,footer{display:none}body{background:white}main{display:block;height:100vh}canvas{width:100%;height:100%;filter:invert(1) hue-rotate(180deg)}}</style></head>
<body><header><span class="brand">ISO Drawer</span><button onclick="fresh()">새 도면</button><button onclick="openFile()">열기</button><button onclick="saveJSON()">저장</button><button onclick="dxf()">DXF 출력</button><button onclick="print()">PDF 인쇄</button><button onclick="undo()">실행 취소</button><button onclick="fit()">전체 맞춤</button><span class="sep"></span><span>좌클릭: 점 입력 · 우클릭: 종료 · 휠: 확대</span></header>
<main><canvas id="cv"></canvas><aside><label>라인 번호</label><input id="line" value="LINE-001"><label>배관 구경</label><input id="size" value='4"'><label>SPEC</label><input id="spec"><label>현재 끝점 부속</label><select id="comp"><option>NONE</option><option>ELBOW_90</option><option>ELBOW_45</option><option>TEE</option><option>GATE_VALVE</option><option>BALL_VALVE</option><option>CHECK_VALVE</option><option>FLANGE</option><option>REDUCER</option><option>WELD</option></select><button onclick="component()" style="margin-top:7px">끝점에 부속 적용</button><div class="help"><b>작업 방법</b><br>1. 시작점을 클릭<br>2. 다음 방향을 클릭<br>3. 실제 길이(mm) 입력<br>4. 필요한 부속 적용<br>5. DXF 또는 PDF 출력<br><br>방향은 ISO 각도(0°·30°·90°·150°)로 자동 고정됩니다.</div></aside></main><footer id="status"></footer><input type="file" id="file" accept=".json" hidden>
<script>
const cv=document.querySelector('#cv'),ctx=cv.getContext('2d'), A=[0,30,90,150,180,210,270,330];let P=[],mouse=null,S=1,ox=0,oy=0,pan=null;
function resize(){let r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}addEventListener('resize',resize);
function world(x,y){return{x:(x-ox)/S,y:(y-oy)/S}}function screen(p){return{x:p.x*S+ox,y:p.y*S+oy}}
function snap(a,b){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;let z=A.reduce((q,v)=>Math.abs(((ang-v+180)%360+360)%360-180)<Math.abs(((ang-q+180)%360+360)%360-180)?v:q);return{x:a.x+d*Math.cos(z*Math.PI/180),y:a.y+d*Math.sin(z*Math.PI/180)}}
function draw(){let w=cv.clientWidth,h=cv.clientHeight;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#263743';ctx.lineWidth=1;let st=50*S;if(st>12){for(let x=((ox%st)+st)%st;x<w;x+=st){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=((oy%st)+st)%st;y<h;y+=st){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}ctx.strokeStyle='#64e6db';ctx.lineWidth=3;for(let i=1;i<P.length;i++){let a=screen(P[i-1]),b=screen(P[i]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle='white';ctx.fillText(P[i].length+' mm',(a.x+b.x)/2,(a.y+b.y)/2-10)}for(let p of P){let q=screen(p);ctx.strokeStyle='#ff7b7b';ctx.strokeRect(q.x-3,q.y-3,6,6);if(p.component!='NONE'){ctx.fillStyle='#ffd166';ctx.fillText(p.component,q.x+7,q.y+13)}}if(P.length&&mouse){let a=screen(P.at(-1)),b=screen(snap(P.at(-1),mouse));ctx.strokeStyle='#ffbf69';ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([])}status.textContent=`포인트 ${P.length}개 · 구간 ${Math.max(0,P.length-1)}개`}
cv.onmousemove=e=>{mouse=world(e.offsetX,e.offsetY);if(pan){ox=pan.ox+e.clientX-pan.x;oy=pan.oy+e.clientY-pan.y}draw()};cv.onmousedown=e=>{if(e.button===1)pan={x:e.clientX,y:e.clientY,ox,oy}};cv.onmouseup=()=>pan=null;cv.oncontextmenu=e=>{e.preventDefault();mouse=null;draw()};
cv.onclick=e=>{let q=world(e.offsetX,e.offsetY);if(!P.length){P.push({...q,length:0,component:'NONE'});draw();return}q=snap(P.at(-1),q);if(Math.hypot(q.x-P.at(-1).x,q.y-P.at(-1).y)<5/S)return;let n=prompt('이 구간의 실제 길이(mm):','1000');if(n===null)return;n=Number(n);if(!(n>0)){alert('0보다 큰 숫자를 입력하세요.');return}P.push({...q,length:n,component:'NONE'});draw()};
cv.onwheel=e=>{e.preventDefault();let q=world(e.offsetX,e.offsetY),f=e.deltaY<0?1.15:1/1.15;S*=f;ox=e.offsetX-q.x*S;oy=e.offsetY-q.y*S;draw()};
function undo(){P.pop();draw()}function component(){if(P.length){P.at(-1).component=comp.value;draw()}}function fresh(){if(confirm('현재 도면을 지울까요?')){P=[];draw()}}
function meta(){return{version:1,line_no:line.value,size:size.value,spec:spec.value,points:P}}function download(name,type,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function saveJSON(){download((line.value||'iso')+'.json','application/json',JSON.stringify(meta(),null,2))}function openFile(){file.click()}file.onchange=()=>{let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);P=d.points||[];line.value=d.line_no||'';size.value=d.size||'';spec.value=d.spec||'';fit()}catch(e){alert('올바른 프로젝트 파일이 아닙니다.')}};r.readAsText(file.files[0])};
function dxf(){if(P.length<2)return alert('포인트를 2개 이상 입력하세요.');let o=['0','SECTION','2','ENTITIES'];let add=(...x)=>o.push(...x.map(String));for(let i=1;i<P.length;i++){let a=P[i-1],b=P[i];add('0','LINE','8','PIPE','10',a.x,'20',-a.y,'30',0,'11',b.x,'21',-b.y,'31',0);add('0','TEXT','8','DIM','10',(a.x+b.x)/2,'20',-(a.y+b.y)/2+6,'30',0,'40',4,'1',b.length+' mm');if(b.component!='NONE')add('0','TEXT','8','COMPONENT','10',b.x+4,'20',-b.y+4,'30',0,'40',3.5,'1',b.component)}add('0','ENDSEC','0','EOF');download((line.value||'iso')+'.dxf','application/dxf',o.join('\n')+'\n')}
function fit(){if(!P.length){S=1;ox=oy=0;draw();return}let xs=P.map(p=>p.x),ys=P.map(p=>p.y),w=cv.clientWidth,h=cv.clientHeight;S=Math.min((w-120)/Math.max(Math.max(...xs)-Math.min(...xs),1),(h-120)/Math.max(Math.max(...ys)-Math.min(...ys),1));ox=60-Math.min(...xs)*S;oy=60-Math.min(...ys)*S;draw()}
onkeydown=e=>{if((e.ctrlKey&&e.key==='z')||e.key==='Escape'){e.preventDefault();e.key==='Escape'?(mouse=null,draw()):undo()}};resize();
</script></body></html>
